name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # ─────────────────────────────────────────────
  # Build + lint on every push/PR
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Wrangler types
        run: npx wrangler types --env-interface CloudflareBindings src/env.d.ts
        continue-on-error: true  # Non-fatal if bindings not yet set up

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Add build-time env vars here (non-secret only)
          SITE_URL: https://jaysonknight.com

      - name: Verify OG runtime assets in build output
        run: |
          test -f dist/client/wasm/resvg.wasm
          test -f dist/client/fonts/space-grotesk-400.woff
          test -f dist/client/fonts/space-grotesk-700.woff
          ls -l dist/client/wasm dist/client/fonts

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ─────────────────────────────────────────────
  # Test + coverage on every push/PR
  # ─────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-typescript
          path: coverage/cobertura-coverage.xml
          retention-days: 1

  # ─────────────────────────────────────────────
  # Upload coverage report to GitHub
  # ─────────────────────────────────────────────
  upload-coverage-typescript:
    name: Upload Coverage (TypeScript)
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-typescript

      - uses: actions/upload-code-coverage@v1
        with:
          file: cobertura-coverage.xml
          language: TypeScript
          label: code-coverage-agent

  # ─────────────────────────────────────────────
  # Deploy to Cloudflare Workers (main branch only)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://jaysonknight.com
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Verify OG runtime assets in deploy artifact
        run: |
          test -f dist/client/wasm/resvg.wasm
          test -f dist/client/fonts/space-grotesk-400.woff
          test -f dist/client/fonts/space-grotesk-700.woff
          ls -l dist/client/wasm dist/client/fonts

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

# ─────────────────────────────────────────────
# Required GitHub Secrets (set in repo Settings → Secrets → Actions):
#
#   CLOUDFLARE_API_TOKEN   — Wrangler API token (Workers:Edit permission)
#   CLOUDFLARE_ACCOUNT_ID  — Your Cloudflare account ID
#
# Get your API token at: https://dash.cloudflare.com/profile/api-tokens
# Use the "Edit Cloudflare Workers" template
# ─────────────────────────────────────────────
